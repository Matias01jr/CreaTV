<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>CreaTV</title>
    <link rel="stylesheet" href="./style.css"/>
    <script src="./main.js" defer></script>
</head>
<body>
    <div class="app-container">

        <!-- Top App Bar estilo Android -->
        <header class="app-header">
            <h1 class="main-title">CreaTV</h1>
            <p langId="selecBuscaCreador" class="subtitle"></p>
        </header>

        <!-- Contenido principal interactivo -->
        <main class="app-content">

            <!-- Sección: Buscar / Personalizado (Sección Principal) -->
            <section id="tab-custom" class="tab-page active">
                <div class="card-section">
                    <h2 langId="creadorPerson" class="section-title"></h2>
                    
                    <form id="custom-creator-form" class="custom-form">
                        <div class="field-group">
                            <label for="nametag" class="field-label">Nametag</label>
                            <input 
                                type="text" 
                                id="nametag" 
                                class="custom-input" 
                                placeholder="elxokas, ibai, rubius..." 
                                required
                            >
                        </div>

                        <div class="field-group">
                            <span langId="selecPlatafor" class="field-label"></span>
                            <div class="platform-options">
                                <label class="platform-card platform-twitch">
                                    <input type="radio" name="platform" value="twitch" checked>
                                    <span class="platform-btn">Twitch</span>
                                </label>

                                <label class="platform-card platform-kick">
                                    <input type="radio" name="platform" value="kick">
                                    <span class="platform-btn">Kick</span>
                                </label>

                                <label class="platform-card platform-youtube">
                                    <input type="radio" name="platform" value="youtube">
                                    <span class="platform-btn">YouTube</span>
                                </label>

                                <label class="platform-card platform-tiktok">
                                    <input type="radio" name="platform" value="tiktok">
                                    <span class="platform-btn">TikTok</span>
                                </label>
                            </div>
                        </div>

                        <div class="checkbox-group">
                            <label class="custom-checkbox-container">
                                <input type="checkbox" id="save-creator" class="checkbox-input">
                                <span class="checkbox-custom"></span>
                                <span langId="guardar" class="checkbox-label"></span>
                            </label>
                        </div>

                        <button type="submit" id="btn-watch" class="btn-watch">
                            <span langId="ver"></span>
                        </button>
                    </form>
                </div>
            </section>

            <!-- Sección: Creadores Guardados -->
            <section id="tab-saved" class="tab-page">
                <h2 langId="creadoresGuarda" class="section-title"></h2>
                <div id="creadores-guardados" class="creators-grid"></div>
            </section>

            <!-- Sección: Creadores Destacados -->
            <section id="tab-featured" class="tab-page">
                <h2 langId="creadoresDesta" class="section-title"></h2>
                <div id="creadores-destacados" class="creators-grid"></div>
            </section>

            <!-- Sección: Ajustes de Reproducción -->
            <section id="tab-settings" class="tab-page">
                <div class="card-section">
                    <h2 class="section-title">Ajustes</h2>
                    
                    <div class="quality-selector-container">
                        <label langId="calidad" for="stream-quality" class="quality-label"></label>
                        <div class="select-wrapper">
                            <select id="stream-quality" class="custom-select">
                                <option langId="mejorCalidad" value="best" selected></option>
                                <option langId="bajaCalidad" value="low"></option>
                            </select>
                        </div>
                    </div>

                    <div class="chat-option-container">
                        <label class="custom-checkbox-container" for="open-chat">
                            <input type="checkbox" id="open-chat" class="checkbox-input">
                            <span class="checkbox-custom"></span>
                            <span langId="abrirChatTwitch" class="checkbox-label"></span>
                        </label>
                    </div>
                </div>
            </section>

        </main>

        <!-- Barra de Navegación Inferior (Bottom Navigation) -->
        <nav class="bottom-nav">
            <button type="button" class="nav-item active" onclick="switchTab('tab-custom', this)">
                <span class="nav-icon">🔍</span>
                <span class="nav-label">Buscar</span>
            </button>
            <button type="button" class="nav-item" onclick="switchTab('tab-saved', this)">
                <span class="nav-icon">⭐</span>
                <span class="nav-label">Guardados</span>
            </button>
            <button type="button" class="nav-item" onclick="switchTab('tab-featured', this)">
                <span class="nav-icon">🔥</span>
                <span class="nav-label">Destacados</span>
            </button>
            <button type="button" class="nav-item" onclick="switchTab('tab-settings', this)">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Ajustes</span>
            </button>
        </nav>

    </div>
</body>
</html>
